services:
  # Base de Datos de Escritura (Write Model)
  postgres-write:
    image: postgres:17-alpine
    container_name: ts-postgres-write
    environment:
      POSTGRES_DB: orders_write_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"

  # Base de Datos de Lectura (Read Model - CQRS)
  postgres-read:
    image: postgres:17-alpine
    container_name: ts-postgres-read
    environment:
      POSTGRES_DB: orders_read_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432" # Mapeamos al puerto 5433 para no chocar con la de arriba

  # Cache y Master Data
  redis:
    image: redis:7.4-alpine
    container_name: ts-redis
    ports:
      - "6379:6379"

  # Bus de Eventos (Kafka en modo KRaft, sin Zookeeper)
  kafka:
    image: bitnami/kafka:3.9
    container_name: ts-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@localhost:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - "9092:9092"